    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

.timer-ring {
  transition: stroke-dashoffset 1s linear;
}

@media print {
  .no-print {
    display: none !important;
  }
  body {
    background: white;
  }
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }

  /* The dashboard shell is a fixed-height, internally-scrolling app layout
     (so the sidebar stays put while you scroll a long page on screen) — but
     that same fixed height is exactly what was telling the browser "this is
     the whole page" when printing, cutting the report off after whatever
     fit on one screen. Release all of that for print so the full content
     lays out normally and paginates across as many pages as it needs. */
  html, body {
    height: auto !important;
    overflow: visible !important;
  }
  .print-shell-root {
    display: block !important;
    height: auto !important;
    overflow: visible !important;
  }
  .print-shell-col {
    display: block !important;
    height: auto !important;
    overflow: visible !important;
  }
  .print-shell-main {
    height: auto !important;
    overflow: visible !important;
    padding: 0 !important;
  }

  /* Document-style report printing. Colors are intentionally NOT stripped
     here — the whole point is that what you see on screen after
     "Generate report" is exactly what comes out the printer / Save as PDF,
     no separate grayscale mode. print-color-adjust above already makes
     backgrounds/colors survive the print dialog. */
  @page {
    size: A4;
    margin: 12mm;
  }
  #report-content {
    font-family: Georgia, 'Times New Roman', serif;
    /* 100vh is unreliable during print (Chrome often sizes it off the
       browser window, not the paper), which is why the footer wasn't
       actually reaching the bottom of the page before. Using the real A4
       height minus the @page margins above makes this the true printed
       page height, so mt-auto on the footer has real room to push into. */
    min-height: calc(297mm - 24mm);
    background: #ffffff !important;
  }
  html, body, .print-shell-main {
    background: #ffffff !important;
  }
  #report-content * {
    box-shadow: none !important;
  }
  #report-content table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }
  #report-content th,
  #report-content td {
    border-bottom: 1px solid rgba(0,0,0,0.08);
    font-size: 10.5px;
    padding: 5px 6px !important;
    white-space: normal !important;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  #report-content tr {
    -moz-column-break-inside: avoid;
         break-inside: avoid;
    page-break-inside: avoid;
  }
  #report-content .overflow-x-auto {
    overflow: visible !important;
  }
}

.print-header {
  display: none;

.spa-collapse{display:none;align-items:center;gap:10px;margin:0 16px 18px;padding:8px 12px;color:#aecac0;font-size:11px;border:1px solid #ffffff12;border-radius:10px;white-space:nowrap}
.spa-collapse:hover{background:#ffffff0b;color:white}
.spa-navigation{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 14px 20px;scrollbar-width:thin;scrollbar-color:#4f8b7866 transparent}
.spa-nav-heading{font-size:9px;letter-spacing:2px;color:#7fab9d;padding:0 12px;margin-bottom:12px}
.spa-nav-link{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 12px;margin-bottom:5px;border:1px solid transparent;border-radius:12px;font-size:13px;color:#d7e6e1;transition:background .18s,color .18s,border-color .18s}
.spa-nav-link:hover{background:#ffffff0b;color:white;border-color:#ffffff0b}
.spa-nav-link.is-active{background:linear-gradient(110deg,#4f8b784c,#2f6b5840);border-color:#7fab9d40;color:#fff;box-shadow:inset 0 1px 0 #ffffff0d,0 4px 12px #0000000a}
.spa-nav-link.is-active-group{color:#e2c58e}
.spa-nav-icon{display:flex;align-items:center;justify-content:center;width:20px;flex-shrink:0}
.spa-sidebar-label{white-space:nowrap}
.spa-active-dot{margin-left:auto;width:5px;height:5px;flex-shrink:0;border-radius:50%;background:#d3ab5c;box-shadow:0 0 9px #d3ab5c55}
.spa-nav-children{margin:3px 0 12px 22px;padding-left:10px;border-left:1px solid #7fab9d33}
.spa-child-link{font-size:12px;min-height:39px;padding:8px;gap:9px}
.spa-account{position:relative;flex-shrink:0;padding:14px;border-top:1px solid #ffffff12;background:#ffffff03}
.spa-account-trigger{display:flex;align-items:center;gap:10px;width:100%;padding:10px 6px;border-radius:12px;border:1px solid transparent;transition:background .2s}
.spa-account-trigger:hover,.spa-account-trigger.is-open{background:#ffffff09;border-color:#ffffff12}
.spa-avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e2d5b8,#c2933d);color:#173d32;font-size:12px;font-weight:700;border:2px solid #ffffff33;box-shadow:0 2px 8px #0002}
.spa-account-panel{position:absolute;bottom:calc(100% + 10px);left:14px;width:286px;max-width:calc(100vw - 28px);max-height:calc(100dvh - 120px);overflow-y:auto;padding:18px 14px 8px;background:linear-gradient(145deg,#214b3e,#122f27);border:1px solid #7fab9d55;border-radius:18px;box-shadow:0 20px 60px #061a1940;animation:spa-account-in .18s ease-out}
.spa-account-action{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px;margin:6px 0;border-radius:9px;font-size:13px;text-align:left}
.spa-account-action:hover{background:#ffffff0b}
.spa-signout{color:#f0c6ba}
.spa-sidebar button:focus-visible,.spa-sidebar a:focus-visible{outline:2px solid #d3ab5c;outline-offset:2px}
@keyframes spa-account-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:768px){.spa-sidebar{position:relative;transform:none}.spa-collapse{display:flex}.spa-sidebar-collapsed{width:84px}.spa-sidebar-collapsed .spa-sidebar-label,.spa-sidebar-collapsed .spa-nav-children{display:none}.spa-sidebar-collapsed .spa-brand{padding:28px 22px 22px}.spa-sidebar-collapsed .spa-collapse{justify-content:center;margin-left:16px;margin-right:16px;padding:8px}.spa-sidebar-collapsed .spa-navigation{padding-left:14px;padding-right:14px}.spa-sidebar-collapsed .spa-nav-link{justify-content:center;padding:12px}.spa-sidebar-collapsed .spa-account-trigger{justify-content:center;padding:8px 0}.spa-sidebar-collapsed .spa-account-panel{left:14px}}
@media(prefers-reduced-motion:reduce){.spa-sidebar,.spa-nav-link,.spa-account-trigger{transition:none}.spa-account-panel{animation:none}}
